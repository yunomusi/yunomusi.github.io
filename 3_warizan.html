<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わくわく！わりざんランド</title>
<style>
  :root {
    --primary: #ff8fb1;
    --primary-dark: #f06292;
    --secondary: #ffeaa7;
    --accent: #55efc4;
    --bg: #fffbf0;
    --card: #ffffff;
    --text: #2d3436;
    --font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family);
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .container {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 10px 25px rgba(255, 143, 177, 0.2);
    border: 4px solid var(--primary);
    padding: 24px;
    text-align: center;
  }

  h1 {
    font-size: 1.6rem;
    color: var(--primary-dark);
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 1rem;
    font-weight: bold;
    margin: 14px 0 8px;
    color: #636e72;
  }

  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .btn-group.three {
    grid-template-columns: 1fr 1fr 1fr;
  }

  .select-btn {
    background: #f8f9fa;
    border: 2px solid #dfe6e9;
    border-radius: 16px;
    padding: 12px 8px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .select-btn.active {
    background: var(--secondary);
    border-color: #fdcb6e;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(253, 203, 110, 0.4);
  }

  .main-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 14px 28px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--primary-dark);
    transition: all 0.1s;
    width: 100%;
    margin-top: 14px;
  }
  .main-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--primary-dark);
  }

  /* 大きくて見やすいタイマー表示エリア */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff0f5;
    padding: 12px 18px;
    border-radius: 18px;
    margin-bottom: 16px;
    border: 2px solid #ffccd5;
  }
  .hud-item {
    font-size: 1.05rem;
    font-weight: bold;
    color: #555;
  }
  .timer-box {
    font-size: 1.55rem;
    font-weight: 900;
    color: #d63031;
    font-family: monospace;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .question-box {
    background: #fafafa;
    border: 3px dashed var(--primary);
    border-radius: 20px;
    padding: 20px 10px;
    margin-bottom: 16px;
  }
  .formula {
    font-size: 2.2rem;
    font-weight: bold;
    color: var(--text);
  }

  /* 入力欄 */
  .input-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 1.2rem;
    font-weight: bold;
  }
  .input-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .input-label {
    font-size: 0.85rem;
    color: #636e72;
  }
  .answer-input {
    width: 80px;
    height: 54px;
    text-align: center;
    font-size: 1.6rem;
    font-weight: bold;
    border: 3px solid #b2bec3;
    border-radius: 14px;
    outline: none;
    background: white;
    cursor: pointer;
    transition: all 0.2s;
  }
  /* 現在選択されている入力欄の見た目 */
  .answer-input.current-focus {
    border-color: #ff7675;
    background-color: #fff9db;
    box-shadow: 0 0 0 4px rgba(255, 118, 117, 0.2);
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .keypad button {
    padding: 12px 0;
    font-size: 1.3rem;
    font-weight: bold;
    border: 2px solid #dfe6e9;
    background: white;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .keypad button:active {
    background: #f1f2f6;
  }
  .keypad button.func-btn {
    font-size: 1rem;
    background: #f1f2f6;
    color: #2d3436;
  }

  .records-list {
    text-align: left;
    max-height: 180px;
    overflow-y: auto;
    margin: 14px 0;
    padding: 8px 12px;
    background: #f8f9fa;
    border-radius: 12px;
    font-size: 0.85rem;
  }
  .records-list li {
    padding: 6px 0;
    border-bottom: 1px dotted #ccc;
    list-style: none;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
  <div id="screen-start">
    <h1>🐾 わりざんランド</h1>

    <div class="section-title">① しゅるいを えらぶ</div>
    <div class="btn-group">
      <button class="select-btn active" id="btn-mode-exact" onclick="setMode('exact')">わりきれる<br>(あまりなし)</button>
      <button class="select-btn" id="btn-mode-rem" onclick="setMode('rem')">あまりがでる<br>(あまりあり)</button>
    </div>

    <div class="section-title">② もんだいすうを えらぶ</div>
    <div class="btn-group three">
      <button class="select-btn active" id="btn-count-10" onclick="setCount(10)">きがるに<br>10問</button>
      <button class="select-btn" id="btn-count-30" onclick="setCount(30)">しっかり<br>30問</button>
      <button class="select-btn" id="btn-count-50" onclick="setCount(50)">チャレンジ<br>50問</button>
    </div>

    <button class="main-btn" onclick="startGame()">スタート！</button>

    <div class="section-title" style="margin-top:20px;">🏆 これまでの きろく</div>
    <ul class="records-list" id="record-display"></ul>
  </div>

  <div id="screen-game" class="hidden">
    <div class="hud">
      <div class="hud-item">もんだい <span id="current-q" style="color:var(--primary-dark); font-size:1.3rem;">1</span> / <span id="total-q">10</span></div>
      <div class="timer-box">⏱️ <span id="timer-display">00:00</span></div>
    </div>

    <div class="question-box">
      <div class="formula" id="formula-text">12 ÷ 3 =</div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <span class="input-label">しょう</span>
        <input type="text" id="ans-main" class="answer-input current-focus" readonly onclick="selectTarget('ans-main')">
      </div>
      
      <div class="input-wrapper hidden" id="wrap-rem">
        <span class="input-label">あまり</span>
        <input type="text" id="ans-rem" class="answer-input" readonly onclick="selectTarget('ans-rem')">
      </div>
    </div>

    <div class="keypad">
      <button onclick="pressKey('1')">1</button>
      <button onclick="pressKey('2')">2</button>
      <button onclick="pressKey('3')">3</button>
      <button onclick="pressKey('4')">4</button>
      <button onclick="pressKey('5')">5</button>
      <button onclick="pressKey('6')">6</button>
      <button onclick="pressKey('7')">7</button>
      <button onclick="pressKey('8')">8</button>
      <button onclick="pressKey('9')">9</button>
      <button class="func-btn" onclick="pressClear()">クリア</button>
      <button onclick="pressKey('0')">0</button>
      <button class="func-btn" id="btn-toggle" onclick="toggleTarget()">きりかえ</button>
    </div>

    <button class="main-btn" onclick="submitAnswer()">こたえあわせ！</button>
  </div>

  <div id="screen-result" class="hidden">
    <h1>🎉 クリア！やったね！</h1>
    <div class="question-box">
      <p style="font-size:1.1rem; margin-bottom:6px;">クリアタイム</p>
      <p class="formula" id="result-time" style="color:#d63031; font-size: 2.8rem; font-family: monospace;">00:00</p>
      <p id="result-detail" style="margin-top:10px; font-weight:bold;"></p>
    </div>
    <button class="main-btn" onclick="returnToStart()">もういちど あそぶ</button>
  </div>
</div>

<script>
  let selectedMode = 'exact';
  let selectedCount = 10;
  let questions = [];
  let currentIndex = 0;
  let timerInterval = null;
  let startTime = 0;
  let activeInputId = 'ans-main';

  function setMode(mode) {
    selectedMode = mode;
    document.getElementById('btn-mode-exact').classList.toggle('active', mode === 'exact');
    document.getElementById('btn-mode-rem').classList.toggle('active', mode === 'rem');
  }

  function setCount(count) {
    selectedCount = count;
    [10, 30, 50].forEach(c => {
      document.getElementById(`btn-count-${c}`).classList.toggle('active', c === count);
    });
  }

  function generateQuestions() {
    const list = [];
    while(list.length < selectedCount) {
      const b = Math.floor(Math.random() * 8) + 2; // わる数: 2~9
      const q = Math.floor(Math.random() * 9) + 1; // 商: 1~9
      let a, r;

      if (selectedMode === 'exact') {
        a = b * q;
        r = 0;
      } else {
        r = Math.floor(Math.random() * (b - 1)) + 1; // あまり: 1 ~ (b-1)
        a = b * q + r;
        if (a > 89) continue;
      }

      list.push({ dividend: a, divisor: b, answer: q, remainder: r });
    }
    return list;
  }

  function selectTarget(targetId) {
    activeInputId = targetId;
    document.getElementById('ans-main').classList.toggle('current-focus', targetId === 'ans-main');
    document.getElementById('ans-rem').classList.toggle('current-focus', targetId === 'ans-rem');
  }

  function toggleTarget() {
    if (selectedMode !== 'rem') return;
    selectTarget(activeInputId === 'ans-main' ? 'ans-rem' : 'ans-main');
  }

  function startGame() {
    questions = generateQuestions();
    currentIndex = 0;
    document.getElementById('total-q').textContent = selectedCount;
    
    const isRem = selectedMode === 'rem';
    document.getElementById('wrap-rem').classList.toggle('hidden', !isRem);
    document.getElementById('btn-toggle').classList.toggle('hidden', !isRem);

    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-game').classList.remove('hidden');

    selectTarget('ans-main');
    loadQuestion();

    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 100);
  }

  function loadQuestion() {
    const q = questions[currentIndex];
    document.getElementById('current-q').textContent = currentIndex + 1;
    document.getElementById('formula-text').textContent = `${q.dividend} ÷ ${q.divisor} =`;
    document.getElementById('ans-main').value = '';
    document.getElementById('ans-rem').value = '';
    selectTarget('ans-main');
  }

  function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('timer-display').textContent = `${m}:${s}`;
  }

  function pressKey(num) {
    const input = document.getElementById(activeInputId);
    if (input.value.length < 2) {
      input.value += num;
      // 商を入力したら自動であまりの枠にフォーカスを移動するアシスト（あまりありモード時）
      if (selectedMode === 'rem' && activeInputId === 'ans-main') {
        selectTarget('ans-rem');
      }
    }
  }

  function pressClear() {
    document.getElementById(activeInputId).value = '';
  }

  function submitAnswer() {
    const userMain = parseInt(document.getElementById('ans-main').value, 10);
    const userRem = selectedMode === 'rem' ? (parseInt(document.getElementById('ans-rem').value, 10) || 0) : 0;
    const q = questions[currentIndex];

    if (userMain === q.answer && userRem === q.remainder) {
      currentIndex++;
      if (currentIndex >= selectedCount) {
        finishGame();
      } else {
        loadQuestion();
      }
    } else {
      alert('おしい！もういちど けいさんしてみよう！');
      selectTarget('ans-main');
    }
  }

  function finishGame() {
    clearInterval(timerInterval);
    const totalTime = document.getElementById('timer-display').textContent;
    document.getElementById('screen-game').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');
    document.getElementById('result-time').textContent = totalTime;

    const modeName = selectedMode === 'exact' ? 'あまりなし' : 'あまりあり';
    document.getElementById('result-detail').textContent = `${modeName} / ${selectedCount}問`;

    saveRecord(modeName, selectedCount, totalTime);
  }

  function saveRecord(mode, count, time) {
    const records = JSON.parse(localStorage.getItem('wari_records') || '[]');
    const date = new Date();
    const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;
    records.unshift({ mode, count, time, date: dateStr });
    localStorage.setItem('wari_records', JSON.stringify(records.slice(0, 10)));
  }

  function loadRecords() {
    const records = JSON.parse(localStorage.getItem('wari_records') || '[]');
    const display = document.getElementById('record-display');
    if (records.length === 0) {
      display.innerHTML = '<li>まだきろくがありません。ちょうせんしてみよう！</li>';
      return;
    }
    display.innerHTML = records.map(r => 
      `<li>${r.date} - [${r.mode} ${r.count}問] ⏱️ <strong>${r.time}</strong></li>`
    ).join('');
  }

  function returnToStart() {
    loadRecords();
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-start').classList.remove('hidden');
  }

  loadRecords();
</script>
</body>
</html>
