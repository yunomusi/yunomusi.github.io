<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルタイマー</title>
    <!-- Tailwind CSS を読み込んで洗練されたデザインに -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex justify-center items-center h-screen m-0">

    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md text-center border border-slate-100">
        <h1 class="text-sm font-semibold tracking-wider text-slate-400 uppercase mb-6">Focus Timer</h1>
        
        <!-- 残り時間表示 -->
        <div id="timeDisplay" class="text-7xl font-bold tracking-tight text-slate-900 mb-6 font-mono">03:00</div>

        <!-- プログレスバー -->
        <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden mb-8">
            <div id="progressBar" class="w-full h-full bg-indigo-600 transition-all duration-200 ease-linear"></div>
        </div>

        <!-- 時間増減ボタン群 (+1分 / -1分 / +5分 / -5分) -->
        <div class="grid grid-cols-4 gap-2 mb-6">
            <button onclick="adjustTime(-5)" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 py-2.5 rounded-xl text-sm font-semibold transition">-5分</button>
            <button onclick="adjustTime(-1)" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 py-2.5 rounded-xl text-sm font-semibold transition">-1分</button>
            <button onclick="adjustTime(1)" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 py-2.5 rounded-xl text-sm font-semibold transition">+1分</button>
            <button onclick="adjustTime(5)" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 py-2.5 rounded-xl text-sm font-semibold transition">+5分</button>
        </div>

        <!-- メイン操作ボタン群 -->
        <div class="flex gap-3">
            <button id="startStopBtn" onclick="toggleTimer()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white py-3.5 rounded-2xl font-semibold shadow-lg shadow-indigo-100 transition">スタート</button>
            <button id="resetBtn" onclick="resetTimer()" class="flex-1 bg-slate-100 hover:bg-slate-200 active:scale-[0.98] text-slate-600 py-3.5 rounded-2xl font-semibold transition">リセット</button>
        </div>
    </div>

    <!-- カスタム通知モーダル (alert()の代替) -->
    <div id="alertModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden justify-center items-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl animate-in fade-in zoom-in duration-200">
            <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">⏰</div>
            <h3 class="text-lg font-bold text-slate-900 mb-2">時間になりました！</h3>
            <p id="alertMessage" class="text-slate-500 text-sm mb-6">タイマーが終了しました。</p>
            <button onclick="closeAlert()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">OK</button>
        </div>
    </div>

    <script>
        let totalSeconds = 180; // 初期値: 3分 (180秒)
        let remainingSeconds = 180;
        let timerId = null;
        let isRunning = false;

        const timeDisplay = document.getElementById('timeDisplay');
        const progressBar = document.getElementById('progressBar');
        const startStopBtn = document.getElementById('startStopBtn');
        const alertModal = document.getElementById('alertModal');

        // 秒を MM:SS 形式に変換
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // 画面の更新
        function updateDisplay() {
            timeDisplay.textContent = formatTime(remainingSeconds);
            const progressPercent = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
            progressBar.style.width = `${progressPercent}%`;
        }

        // タイマーの開始・一時停止
        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                startStopBtn.textContent = 'スタート';
                startStopBtn.className = 'flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white py-3.5 rounded-2xl font-semibold shadow-lg shadow-indigo-100 transition';
            } else {
                if (remainingSeconds <= 0) return;
                isRunning = true;
                startStopBtn.textContent = '一時停止';
                startStopBtn.className = 'flex-1 bg-rose-500 hover:bg-rose-600 active:scale-[0.98] text-white py-3.5 rounded-2xl font-semibold shadow-lg shadow-rose-100 transition';

                timerId = setInterval(() => {
                    if (remainingSeconds > 0) {
                        remainingSeconds--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        isRunning = false;
                        startStopBtn.textContent = 'スタート';
                        startStopBtn.className = 'flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white py-3.5 rounded-2xl font-semibold shadow-lg shadow-indigo-100 transition';
                        showAlert();
                    }
                }, 1000);
            }
        }

        // リセット
        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            remainingSeconds = totalSeconds;
            startStopBtn.textContent = 'スタート';
            startStopBtn.className = 'flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white py-3.5 rounded-2xl font-semibold shadow-lg shadow-indigo-100 transition';
            updateDisplay();
        }

        // 時間の増減（1分・5分単位）
        function adjustTime(mins) {
            const addSecs = mins * 60;
            
            // 減少時にマイナスにならないようガード
            if (remainingSeconds + addSecs < 0) {
                remainingSeconds = 0;
            } else {
                remainingSeconds += addSecs;
            }

            // 合計時間も連動して更新（プログレスバーの基準になる）
            if (totalSeconds + addSecs < 0) {
                totalSeconds = 0;
            } else {
                totalSeconds += addSecs;
            }

            updateDisplay();
        }

        // モーダル表示
        function showAlert() {
            alertModal.classList.remove('hidden');
            alertModal.classList.add('flex');
        }

        // モーダル非表示
        function closeAlert() {
            alertModal.classList.add('hidden');
            alertModal.classList.remove('flex');
        }

        // 初期化実行
        updateDisplay();
    </script>
</body>
</html>
