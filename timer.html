<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルタイマー</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --gray-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .timer-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: #6b7280;
        }

        /* 時間表示部分 */
        .time-display {
            font-size: 4.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
        }

        /* プログレスバー */
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--gray-color);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background-color: var(--primary-color);
            transition: width 0.2s linear;
        }

        /* クイック追加ボタン群 */
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .btn-quick {
            background-color: #f3f4f6;
            border: none;
            padding: 0.6rem 0;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #4b5563;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-quick:hover {
            background-color: #e5e7eb;
        }

        /* メイン操作ボタン群 */
        .control-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn-main {
            flex: 1;
            padding: 0.8rem 0;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        #startStopBtn {
            background-color: var(--primary-color);
            color: white;
        }

        #startStopBtn:hover {
            background-color: var(--primary-hover);
        }

        #startStopBtn.stop {
            background-color: var(--danger-color);
        }

        #startStopBtn.stop:hover {
            background-color: var(--danger-hover);
        }

        #resetBtn {
            background-color: #e5e7eb;
            color: #374151;
        }

        #resetBtn:hover {
            background-color: #d1d5db;
        }
    </style>
</head>
<body>

    <div class="timer-container">
        <h1>シンプルタイマー</h1>
        
        <!-- 残り時間表示 -->
        <div class="time-display" id="timeDisplay">03:00</div>

        <!-- プログレスバー -->
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- クイック追加ボタン -->
        <div class="quick-buttons">
            <button class="btn-quick" onclick="addTime(1)">+1分</button>
            <button class="btn-quick" onclick="addTime(3)">+3分</button>
            <button class="btn-quick" onclick="addTime(5)">+5分</button>
            <button class="btn-quick" onclick="addTime(10)">+10分</button>
        </div>

        <!-- スタート・リセットボタン -->
        <div class="control-buttons">
            <button class="btn-main" id="startStopBtn" onclick="toggleTimer()">スタート</button>
            <button class="btn-main" id="resetBtn" onclick="resetTimer()">リセット</button>
        </div>
    </div>

    <script>
        let totalSeconds = 180; // 初期設定: 3分 (180秒)
        let remainingSeconds = 180;
        let timerId = null;
        let isRunning = false;

        const timeDisplay = document.getElementById('timeDisplay');
        const progressBar = document.getElementById('progressBar');
        const startStopBtn = document.getElementById('startStopBtn');

        // 時間のフォーマット (秒 -> MM:SS)
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // 画面の更新
        function updateDisplay() {
            timeDisplay.textContent = formatTime(remainingSeconds);
            const progressPercent = (remainingSeconds / totalSeconds) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }

        // タイマーの開始・一時停止
        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                startStopBtn.textContent = 'スタート';
                startStopBtn.classList.remove('stop');
            } else {
                if (remainingSeconds <= 0) return;
                isRunning = true;
                startStopBtn.textContent = '一時停止';
                startStopBtn.classList.add('stop');

                timerId = setInterval(() => {
                    if (remainingSeconds > 0) {
                        remainingSeconds--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        isRunning = false;
                        startStopBtn.textContent = 'スタート';
                        startStopBtn.classList.remove('stop');
                        alert('時間になりました！');
                    }
                }, 1000);
            }
        }

        // リセット
        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            remainingSeconds = totalSeconds;
            startStopBtn.textContent = 'スタート';
            startStopBtn.classList.remove('stop');
            updateDisplay();
        }

        // クイック時間追加
        function addTime(mins) {
            const addSecs = mins * 60;
            totalSeconds += addSecs;
            remainingSeconds += addSecs;
            updateDisplay();
        }

        // 初期表示
        updateDisplay();
    </script>

</body>
</html>
